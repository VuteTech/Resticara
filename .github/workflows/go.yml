name: Go Build and Release

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REF_NAME: ${{ github.ref_name }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
    - uses: actions/checkout@v7
      with:
        # git describe needs the tags for the version of untagged builds
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        # always build with the latest Go release so binaries get standard library security fixes
        go-version: stable

    - name: Vet
      run: go vet ./...

    - name: Run Tests
      run: go test -v ./...

    - name: Set version
      run: |
        # tags: v1.2.3 gives 1.2.3; other builds: 1.2.3+15.gabc1234 (15 commits after v1.2.3),
        # which sorts after the release in dpkg and rpm
        if [[ "$IS_TAG" == "true" ]]; then
          VERSION="${REF_NAME#v}"
          LABEL="$REF_NAME"
        else
          VERSION="$(git describe --tags --abbrev=7 | sed -E 's/^v//; s/-([0-9]+)-g([0-9a-f]+)$/+\1.g\2/')"
          LABEL="$VERSION"
        fi
        mkdir -p dist
        echo "$VERSION" > dist/VERSION
        echo "$LABEL" > dist/LABEL
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Build
      env:
        CGO_ENABLED: 0
        GOOS: linux
      run: |
        for arch in amd64 arm64; do
          GOARCH=$arch go build -v -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/resticara-linux-$arch" .
        done
        dist/resticara-linux-amd64 --version

    - name: Upload binaries
      uses: actions/upload-artifact@v7
      with:
        name: binaries
        path: dist/

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        # update together with .golangci.yml when a release changes the linters
        version: v2.15.0

  integration:
    runs-on: ubuntu-latest
    env:
      # the distribution package may be older than 0.17, which resticara requires
      RESTIC_VERSION: 0.19.1
      RESTICARA_REQUIRE_RESTIC: 1
    steps:
    - uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Install restic
      working-directory: ${{ runner.temp }}
      run: |
        base="https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}"
        asset="restic_${RESTIC_VERSION}_linux_amd64.bz2"
        curl -fsSLO "$base/$asset"
        curl -fsSLO "$base/SHA256SUMS"
        grep " ${asset}\$" SHA256SUMS | sha256sum --check -
        bunzip2 "$asset"
        sudo install -m 0755 "${asset%.bz2}" /usr/local/bin/restic
        restic version

    - name: Vet integration tests
      run: go vet -tags integration ./...

    - name: Run integration tests
      run: go test -tags integration -v ./test/integration/...

  package:
    needs: [build, lint, integration]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: binaries
        path: dist

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Install nfpm
      # pinned on purpose; update it like the golangci-lint version
      run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0

    - name: Build packages and archives
      run: |
        VERSION="$(cat dist/VERSION)"
        LABEL="$(cat dist/LABEL)"
        mkdir -p build release
        for arch in amd64 arm64; do
          case "$arch" in
            amd64) name=x86_64 ;;
            arm64) name=aarch64 ;;
          esac
          install -m 0755 "dist/resticara-linux-$arch" build/resticara
          GOARCH=$arch VERSION=$VERSION nfpm package --packager deb --target "release/resticara-$LABEL.$name.deb"
          GOARCH=$arch VERSION=$VERSION nfpm package --packager rpm --target "release/resticara-$LABEL.$name.rpm"

          dir="resticara-$LABEL-linux-$arch"
          mkdir "$dir"
          install -m 0755 build/resticara "$dir/resticara"
          install -m 0600 config.ini-dist "$dir/config.ini"
          cp -r templates README.md LICENSE "$dir/"
          tar czf "release/resticara-$LABEL.Linux-$name.tar.gz" "$dir"
        done

        # the zip of earlier releases, x86_64 only; superseded by the tar.gz archives
        cp -r "resticara-$LABEL-linux-amd64" "resticara-$LABEL"
        zip -qr "release/resticara-$LABEL.Linux-x86_64.zip" "resticara-$LABEL"

        cd release
        sha256sum * > SHA256SUMS
        cat SHA256SUMS

    - name: Upload release files
      uses: actions/upload-artifact@v7
      with:
        name: release
        path: release/

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download release files
      uses: actions/download-artifact@v8
      with:
        name: release
        path: release

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      working-directory: release
      run: |
        sha256sum --check SHA256SUMS
        gh release create "$TAG" --repo "$REPO" --title "Release $TAG" --generate-notes ./*
