name: Go Build and Release

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        # always build with the latest Go release so binaries get standard library security fixes
        go-version: stable

    - name: Vet
      run: go vet ./...

    - name: Build
      env:
        CGO_ENABLED: 0
      run: go build -v -o resticara

    - name: Run Tests
      run: go test -v ./...

    - name: Upload binary build artifact
      uses: actions/upload-artifact@v7
      with:
        name: resticara-artifacts
        path: resticara

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        # update together with .golangci.yml when a release changes the linters
        version: v2.15.0

  integration:
    runs-on: ubuntu-latest
    env:
      # the distribution package may be older than 0.17, which resticara requires
      RESTIC_VERSION: 0.19.1
      RESTICARA_REQUIRE_RESTIC: 1
    steps:
    - uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Install restic
      working-directory: ${{ runner.temp }}
      run: |
        base="https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}"
        asset="restic_${RESTIC_VERSION}_linux_amd64.bz2"
        curl -fsSLO "$base/$asset"
        curl -fsSLO "$base/SHA256SUMS"
        grep " ${asset}\$" SHA256SUMS | sha256sum --check -
        bunzip2 "$asset"
        sudo install -m 0755 "${asset%.bz2}" /usr/local/bin/restic
        restic version

    - name: Vet integration tests
      run: go vet -tags integration ./...

    - name: Run integration tests
      run: go test -tags integration -v ./test/integration/...

  package:
    needs: [build, lint, integration]
    runs-on: ubuntu-latest
    env:
      REF_NAME: ${{ github.ref_name }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: resticara-artifacts

    - name: Install packaging tools
      run: sudo apt-get -y update && sudo apt-get -y install dpkg-dev rpm zip

    - name: Set version
      run: |
        if [[ "$IS_TAG" == "true" ]]; then
          echo "VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"
          echo "LABEL=$REF_NAME" >> "$GITHUB_ENV"
        else
          echo "VERSION=0.1+$RUN_NUMBER" >> "$GITHUB_ENV"
          echo "LABEL=0.1+$RUN_NUMBER" >> "$GITHUB_ENV"
        fi
        chmod +x resticara

    - name: Build DEB package
      run: |
        mkdir -p debian/DEBIAN debian/usr/local/bin debian/etc/resticara/templates
        install -m 0755 resticara debian/usr/local/bin/resticara
        # the config holds credentials
        install -m 0600 config.ini-dist debian/etc/resticara/config.ini
        install -m 0644 templates/* debian/etc/resticara/templates/
        cat > debian/DEBIAN/control <<EOF
        Package: resticara
        Version: $VERSION
        Architecture: amd64
        Maintainer: Blagovest Petrov <blago.petrov@vute.tech>
        Recommends: restic (>= 0.17)
        Description: Wrapper of Restic for simplified configuration and deployment.
        EOF
        # mark files in /etc as conffiles so upgrades don't overwrite local configuration
        (cd debian && find etc -type f | sed 's|^|/|') > debian/DEBIAN/conffiles
        dpkg-deb --root-owner-group --build debian "resticara-$LABEL.deb"

    - name: Build RPM package
      run: |
        mkdir -p ~/rpmbuild/SOURCES/templates ~/rpmbuild/SPECS
        cp resticara config.ini-dist ~/rpmbuild/SOURCES/
        cp templates/* ~/rpmbuild/SOURCES/templates/
        cat > ~/rpmbuild/SPECS/resticara.spec <<EOF
        Summary: Wrapper of Restic for simplified configuration and deployment.
        Name: resticara
        Version: $VERSION
        Release: 1
        License: GPLv3

        %description
        Wrapper of Restic for simplified configuration and deployment.

        %install
        mkdir -p %{buildroot}/usr/bin %{buildroot}/etc/resticara/templates
        install -m 0755 %{_sourcedir}/resticara %{buildroot}/usr/bin/resticara
        install -m 0600 %{_sourcedir}/config.ini-dist %{buildroot}/etc/resticara/config.ini
        install -m 0644 %{_sourcedir}/templates/* %{buildroot}/etc/resticara/templates/

        %files
        /usr/bin/resticara
        %dir /etc/resticara
        %dir /etc/resticara/templates
        %config(noreplace) %attr(0600,root,root) /etc/resticara/config.ini
        %config(noreplace) /etc/resticara/templates/*
        EOF
        rpmbuild -ba ~/rpmbuild/SPECS/resticara.spec

    - name: Build zip file
      run: |
        mkdir -p "resticara-$LABEL"
        install -m 0755 resticara "resticara-$LABEL/resticara"
        install -m 0600 config.ini-dist "resticara-$LABEL/config.ini"
        cp -r templates/ "resticara-$LABEL"
        zip -r "resticara-$LABEL.zip" "resticara-$LABEL"

    - name: Upload DEB package artifact
      uses: actions/upload-artifact@v7
      with:
        name: deb-package
        path: '*.deb'

    - name: Upload RPM package artifact
      uses: actions/upload-artifact@v7
      with:
        name: rpm-package
        path: ~/rpmbuild/RPMS/**/*.rpm

    - name: Upload ZIP archive artifact
      uses: actions/upload-artifact@v7
      with:
        name: zip-archive
        path: '*.zip'

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download DEB package artifact
      uses: actions/download-artifact@v8
      with:
        name: deb-package

    - name: Download RPM package artifact
      uses: actions/download-artifact@v8
      with:
        name: rpm-package

    - name: Download ZIP archive artifact
      uses: actions/download-artifact@v8
      with:
        name: zip-archive

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        mv "resticara-$TAG.deb" "resticara-$TAG.x86_64.deb"
        mv "$(find . -name '*.rpm' | head -n 1)" "resticara-$TAG.x86_64.rpm"
        mv "resticara-$TAG.zip" "resticara-$TAG.Linux-x86_64.zip"
        gh release create "$TAG" --repo "$REPO" --title "Release $TAG" --notes "Resticara release" \
          "resticara-$TAG.x86_64.deb" "resticara-$TAG.x86_64.rpm" "resticara-$TAG.Linux-x86_64.zip"
